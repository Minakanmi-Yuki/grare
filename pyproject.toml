[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grare"
version = "1.0.0"
description = "Grasp candidate re-ranking for frozen 6-DoF grasp detectors"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "tqdm>=4.66",
    "opencv-python-headless>=4.8",
    "torch>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Feature preparation additionally needs graspnetAPI, which is installed from
# its official repository (see README Installation) because it is not published
# on PyPI. open3d is used to read the GraspNet object meshes during relabeling.
prepare = [
    "mobile-sam @ git+https://github.com/ChaoningZhang/MobileSAM.git",
    "timm>=0.9",
    "open3d>=0.18",
]
test = ["pytest>=7"]

[project.scripts]
grare-run = "grare.cli.run:main"
grare-dump = "grare.cli.dump:main"
grare-prepare = "grare.cli.prepare:main"
grare-precompute-object = "grare.cli.precompute_object:main"
grare-pack = "grare.cli.pack:main"
grare-train = "grare.cli.train:main"
grare-rerank = "grare.cli.rerank:main"
grare-evaluate = "grare.cli.evaluate:main"
grare-smoke = "grare.cli.smoke:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grare*"]

[tool.setuptools.package-data]
grare = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:… keeps third-party pytest plugins from being autoloaded. A sourced ROS 2
# environment puts its site-packages on sys.path, and its launch_testing plugin
# registers a pytest11 entry point that pytest then imports, failing on ROS
# dependencies that have nothing to do with GraRe.
addopts = "-ra -p no:launch -p no:launch_testing -p no:launch_testing_ros"
