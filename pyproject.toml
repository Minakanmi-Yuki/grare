[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grare"
version = "1.0.0"
description = "Grasp candidate re-ranking for frozen 6-DoF grasp detectors"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "tqdm>=4.66",
    "opencv-python-headless>=4.8",
    "torch>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Feature preparation also needs graspnetAPI and MobileSAM. Neither is published
# on PyPI, so both are installed from their official repositories as documented
# in the README; a git dependency here would make pip clone them silently, with
# no progress output and no way to retry just that step. open3d reads the
# GraspNet object meshes during relabeling and timm backs the MobileSAM encoder.
prepare = [
    "timm>=0.9",
    "open3d>=0.18",
]
detectors = [
    # HGGD and the standalone RNGNet decoder use Numba; HGGD additionally
    # imports scikit-image for its released heatmap decoder.
    "Cython>=3.0",
    "numba>=0.60",
    "scikit-image>=0.22",
]
hub = [
    "huggingface_hub>=0.26",
]
test = [
    "pytest>=7",
    # The HF asset tests import the publishing helpers during collection.
    "huggingface_hub>=0.26",
]

[project.scripts]
grare-run = "grare.cli.run:main"
grare-dump = "grare.cli.dump:main"
grare-feature = "grare.cli.feature:main"
grare-fetch = "grare.cli.fetch:main"
grare-demo = "grare.cli.demo:main"
grare-prepare = "grare.cli.prepare:main"
grare-manifest = "grare.cli.manifest:main"
grare-precompute-object = "grare.cli.precompute_object:main"
grare-pack = "grare.cli.pack:main"
grare-train = "grare.cli.train:main"
grare-rerank = "grare.cli.rerank:main"
grare-evaluate = "grare.cli.evaluate:main"
grare-smoke = "grare.cli.smoke:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grare*"]

[tool.setuptools.package-data]
grare = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:… keeps third-party pytest plugins from being autoloaded. A sourced ROS 2
# environment puts its site-packages on sys.path, and its launch_testing plugin
# registers a pytest11 entry point that pytest then imports, failing on ROS
# dependencies that have nothing to do with GraRe.
addopts = "-ra -p no:launch -p no:launch_testing -p no:launch_testing_ros"
