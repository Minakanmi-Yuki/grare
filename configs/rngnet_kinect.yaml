extends: _base.yaml
name: rngnet_kinect
detector: rngnet
camera: kinect
paths:
  local_cloud_train: ${GRARE_DATA_ROOT}/relabeled/rngnet/kinect/local_cloud/train
  local_cloud_test: ${GRARE_DATA_ROOT}/relabeled/rngnet/kinect/local_cloud/test
  object_pooled_train: ${GRARE_DATA_ROOT}/relabeled/rngnet/kinect/object_pooled/train
  object_pooled_test: ${GRARE_DATA_ROOT}/relabeled/rngnet/kinect/object_pooled/test
  checkpoint_dir: ${GRARE_OUTPUT_ROOT}/checkpoints/rngnet_kinect
  rerank_dir: ${GRARE_OUTPUT_ROOT}/predictions/rngnet_kinect
  eval_dir: ${GRARE_OUTPUT_ROOT}/evaluation/rngnet_kinect
  packed_train: ${GRARE_DATA_ROOT}/packed/rngnet/kinect/train

train:
  # Keep the Kinect comparison budget aligned with GN Kinect. RNGNet's
  # detector-specific dump and feature archives remain unchanged.
  max_epochs: 80
  min_optimizer_steps: 50000
  min_checkpoint_steps: 20000
  early_stop_patience: 15
  scheduler_patience: 8
  scheduler_min_lr: 0.000001
  scheduler_warmup_steps: 30000
  checkpoint_interval_steps: 5000
  local_health_max_batches: 4
  local_health_seed: 20260710
  min_local_raw_rms: 0.05
  min_local_shuffle_ratio: 0.05
rerank:
  lambda: 0.5
